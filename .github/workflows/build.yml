name: CI (Cross-Platform Release Verification)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x86_64'
            os: windows-latest
            rust-targets: ''
            build-args: ''
          - platform: 'linux-x86_64'
            os: ubuntu-22.04
            rust-targets: ''
            build-args: '--bundles deb,appimage'
          - platform: 'macos-universal'
            os: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            build-args: '--target universal-apple-darwin --bundles dmg'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Tailwind CSS Bundle
        run: npm run build:css

      - name: Build Tauri Desktop (Release Mode)
        run: npx @tauri-apps/cli build ${{ matrix.build-args }}
        env:
          CI: true

      - name: Export Release Build Artifacts
        run: node scripts/export-builds.js --release-only

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmanager-desktop-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Setup Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Configure Android Linker
        run: |
          LLVM_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG_BIN="$LLVM_BIN/aarch64-linux-android34-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG_BIN" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$CLANG_BIN" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar" >> $GITHUB_ENV
          echo "$LLVM_BIN" >> $GITHUB_PATH

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Android Release APK
        run: bash scripts/build-android.sh release
        env:
          CI: true

      - name: Export Android Release Artifacts
        run: node scripts/export-builds.js --release-only

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmanager-android-release
          path: |
            dist/android/*.apk
            dist/Hmanager-Pro-arm64-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
